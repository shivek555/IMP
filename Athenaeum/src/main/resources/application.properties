# Athenaeum Academic Document Management System
# Spring Boot Application Configuration for SQL Server

# Application Information
spring.application.name=Athenaeum
info.app.name=Athenaeum Academic Document Management
info.app.description=Complete academic document and note management system
info.app.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=athenaeum_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=shivek
spring.datasource.password=SHIVEKSM123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Database Initialization
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.separator=;
spring.sql.init.encoding=UTF-8

# Connection Pool Settings for SQL Server
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Custom File Upload Properties
athenaeum.file.upload-dir=uploads
athenaeum.file.max-size=52428800
athenaeum.file.allowed-types=pdf,doc,docx,txt,rtf,odt
athenaeum.file.storage-path=./uploads/

# JWT Security Configuration
athenaeum.jwt.secret=athenaeum_jwt_secret_key_2025_very_secure_for_academic_document_management_system
athenaeum.jwt.expiration=86400000
athenaeum.jwt.issuer=Athenaeum
athenaeum.jwt.audience=athenaeum-users

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=USER,ADMIN

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=ATHENAEUM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=1800
server.servlet.session.tracking-modes=cookie

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.athenaeum=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
logging.level.org.springframework=DEBUG
server.error.include-stacktrace=always
server.error.include-message=always

# Development Tools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.add-properties=true

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Actuator Configuration (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# NLP Configuration (Custom properties)
athenaeum.nlp.enabled=true
athenaeum.nlp.summary.max-sentences=3
athenaeum.nlp.keywords.max-count=10
athenaeum.nlp.language=en

# Search Configuration
athenaeum.search.results-per-page=10
athenaeum.search.max-results=100
athenaeum.search.highlight-enabled=true
