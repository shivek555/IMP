<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Athenaeum</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-book"></i> Athenaeum</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="bi bi-search"></i> Search Documents & Notes</h4>
                        <p class="mb-0 text-muted">Search across all your documents and notes</p>
                    </div>
                    <div class="card-body">
                        <form method="get" th:action="@{/search/results}">
                            <div class="mb-3">
                                <label for="q" class="form-label">Search Query</label>
                                <input type="text" class="form-control form-control-lg" id="q" name="q" 
                                       placeholder="Enter keywords, phrases, or topics..." required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="folder" class="form-label">Filter by Folder (Optional)</label>
                                    <select class="form-select" id="folder" name="folder">
                                        <option value="">All Folders</option>
                                        <!-- Options would be populated dynamically -->
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="tag" class="form-label">Filter by Tag (Optional)</label>
                                    <input type="text" class="form-control" id="tag" name="tag" 
                                           placeholder="Enter tag name">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/dashboard}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search"></i> Search
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Quick Search Tips -->
                <div class="card mt-3">
                    <div class="card-body">
                        <h6><i class="bi bi-lightbulb"></i> Search Tips:</h6>
                        <ul class="mb-0">
                            <li>Search by keywords, titles, or content</li>
                            <li>Use folder filters to narrow down results</li>
                            <li>Tag searches help find related content</li>
                            <li>Results are ranked by relevance</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
