<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${document.title} + ' - Athenaeum'">Document - Athenaeum</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-book"></i> Athenaeum</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4 th:text="${document.title}">Document Title</h4>
                                <p class="mb-0 text-muted">
                                    <i class="bi bi-file-earmark-text"></i> 
                                    <span th:text="${document.fileName}"></span>
                                    <span class="badge bg-secondary ms-2" th:text="${document.fileType}"></span>
                                </p>
                            </div>
                            <div class="btn-group">
                                <a th:href="@{/documents/{id}/download(id=${document.id})}" 
                                   class="btn btn-primary">
                                    <i class="bi bi-download"></i> Download
                                </a>
                                <button type="button" class="btn btn-danger" data-bs-toggle="modal" 
                                        data-bs-target="#deleteModal">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div th:if="${document.summary}" class="alert alert-info">
                            <h6><i class="bi bi-info-circle"></i> Summary</h6>
                            <p class="mb-0" th:text="${document.summary}"></p>
                        </div>

                        <div th:if="${document.keywords}" class="mb-3">
                            <h6><i class="bi bi-tags"></i> Keywords</h6>
                            <div th:each="keyword : ${#strings.listSplit(document.keywords, ',')}" 
                                 class="badge bg-primary me-1 mb-1" th:text="${#strings.trim(keyword)}"></div>
                        </div>

                        <div th:if="${document.content}" class="content-section">
                            <h6><i class="bi bi-file-text"></i> Content</h6>
                            <div class="content-text" th:text="${document.content}" style="white-space: pre-wrap; max-height: 600px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; border-radius: 5px; background-color: #f8f9fa;"></div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <small class="text-muted">
                            Created: <span th:text="${#temporals.format(document.createdAt, 'MMM dd, yyyy HH:mm')}"></span> | 
                            Updated: <span th:text="${#temporals.format(document.updatedAt, 'MMM dd, yyyy HH:mm')}"></span>
                            <span th:if="${document.folder}"> | Folder: <span th:text="${document.folder}"></span></span>
                        </small>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h6><i class="bi bi-diagram-3"></i> Related Items</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(relatedItems)}" class="text-muted">
                            No related items found.
                        </div>

                        <div th:if="${!#lists.isEmpty(relatedItems)}">
                            <div class="list-group list-group-flush">
                                <div class="list-group-item px-0" th:each="item : ${relatedItems}">
                                    <h6 class="mb-1">
                                        <a th:href="@{/{type}s/{id}(type=${item.type},id=${item.id})}" 
                                           th:text="${item.title}"></a>
                                    </h6>
                                    <small class="text-muted" th:text="${item.type}"></small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h6><i class="bi bi-info-circle"></i> Document Info</h6>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr>
                                <td><strong>File Type:</strong></td>
                                <td th:text="${document.fileType}"></td>
                            </tr>
                            <tr>
                                <td><strong>File Size:</strong></td>
                                <td th:text="${#numbers.formatDecimal(document.fileSize / 1024.0, 1, 2)} + ' KB'"></td>
                            </tr>
                            <tr th:if="${document.folder}">
                                <td><strong>Folder:</strong></td>
                                <td th:text="${document.folder}"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <a th:href="@{/dashboard}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this document? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form method="post" th:action="@{/documents/{id}/delete(id=${document.id})}" style="display: inline;">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
