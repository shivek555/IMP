<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph - Athenaeum</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-book"></i> Athenaeum</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h4><i class="bi bi-diagram-3"></i> Knowledge Graph</h4>
                                <p class="mb-0 text-muted">Visual representation of relationships between your documents and notes</p>
                            </div>
                            <div class="btn-group">
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="resetGraph()">
                                    <i class="bi bi-arrow-clockwise"></i> Reset View
                                </button>
                                <a th:href="@{/dashboard}" class="btn btn-sm btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Back
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="graph-container" style="width: 100%; height: 600px; border: 1px solid #dee2e6; border-radius: 5px;">
                            <div id="graph-svg"></div>
                            <div id="graph-info" class="position-absolute" style="top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 5px; display: none;">
                                <h6 id="node-title"></h6>
                                <p id="node-type" class="mb-1"></p>
                                <p id="node-details" class="mb-0 small text-muted"></p>
                            </div>
                        </div>

                        <div class="mt-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6><i class="bi bi-info-circle"></i> Legend</h6>
                                    <div class="d-flex flex-wrap">
                                        <span class="badge bg-primary me-2 mb-1">
                                            <i class="bi bi-circle-fill"></i> Documents
                                        </span>
                                        <span class="badge bg-success me-2 mb-1">
                                            <i class="bi bi-circle-fill"></i> Notes
                                        </span>
                                        <span class="badge bg-secondary me-2 mb-1">
                                            <i class="bi bi-dash-lg"></i> Related Items
                                        </span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <h6><i class="bi bi-mouse"></i> Controls</h6>
                                    <ul class="list-unstyled small">
                                        <li><strong>Click:</strong> Select and view item details</li>
                                        <li><strong>Drag:</strong> Move nodes around</li>
                                        <li><strong>Scroll:</strong> Zoom in/out</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const graphData = /*[[${graphData}]]*/ {nodes: [], links: []};
        /*]]>*/

        // Initialize D3 force-directed graph
        const width = document.getElementById('graph-container').offsetWidth;
        const height = 600;

        const svg = d3.select('#graph-svg')
            .append('svg')
            .attr('width', width)
            .attr('height', height)
            .call(d3.zoom()
                .on('zoom', function(event) {
                    container.attr('transform', event.transform);
                })
            );

        const container = svg.append('g');

        // Define arrow markers
        svg.append('defs').selectAll('marker')
            .data(['end'])
            .enter().append('marker')
            .attr('id', String)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 20)
            .attr('refY', 0)
            .attr('markerWidth', 8)
            .attr('markerHeight', 8)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', '#666');

        // Create simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(100))
            .force('charge', d3.forceManyBody().strength(-300))
            .force('center', d3.forceCenter(width / 2, height / 2));

        // Create links
        const link = container.append('g')
            .selectAll('line')
            .data(graphData.links)
            .enter().append('line')
            .attr('stroke', '#666')
            .attr('stroke-opacity', 0.6)
            .attr('stroke-width', 2)
            .attr('marker-end', 'url(#end)');

        // Create nodes
        const node = container.append('g')
            .selectAll('circle')
            .data(graphData.nodes)
            .enter().append('circle')
            .attr('r', 8)
            .attr('fill', d => d.type === 'document' ? '#0d6efd' : '#198754')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2)
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended))
            .on('click', function(event, d) {
                showNodeInfo(d);
                // Highlight connected nodes
                highlightConnected(d);
            })
            .on('mouseover', function(event, d) {
                d3.select(this).attr('r', 12);
            })
            .on('mouseout', function(event, d) {
                d3.select(this).attr('r', 8);
            });

        // Add labels
        const labels = container.append('g')
            .selectAll('text')
            .data(graphData.nodes)
            .enter().append('text')
            .text(d => d.title.length > 20 ? d.title.substring(0, 20) + '...' : d.title)
            .attr('font-size', '12px')
            .attr('dx', 12)
            .attr('dy', 4)
            .attr('fill', '#333');

        // Update positions on tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node
                .attr('cx', d => d.x)
                .attr('cy', d => d.y);

            labels
                .attr('x', d => d.x)
                .attr('y', d => d.y);
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Show node information
        function showNodeInfo(d) {
            const info = document.getElementById('graph-info');
            document.getElementById('node-title').textContent = d.title;
            document.getElementById('node-type').textContent = d.type.charAt(0).toUpperCase() + d.type.slice(1);
            document.getElementById('node-details').textContent = `Click to view details`;
            info.style.display = 'block';

            // Redirect to item view after a short delay
            setTimeout(() => {
                window.location.href = `/${d.type}s/${d.id}`;
            }, 1000);
        }

        // Highlight connected nodes
        function highlightConnected(selectedNode) {
            // Reset all nodes to normal opacity
            node.style('opacity', 0.3);
            link.style('opacity', 0.1);
            labels.style('opacity', 0.3);

            // Highlight selected node
            d3.select(node.nodes().find(n => n.__data__.id === selectedNode.id))
                .style('opacity', 1);

            // Highlight connected nodes and links
            graphData.links.forEach(l => {
                if (l.source.id === selectedNode.id || l.target.id === selectedNode.id) {
                    d3.select(link.nodes()[graphData.links.indexOf(l)])
                        .style('opacity', 0.8);
                    d3.select(node.nodes().find(n => n.__data__.id === l.source.id))
                        .style('opacity', 1);
                    d3.select(node.nodes().find(n => n.__data__.id === l.target.id))
                        .style('opacity', 1);
                    d3.select(labels.nodes().find(n => n.__data__.id === l.source.id))
                        .style('opacity', 1);
                    d3.select(labels.nodes().find(n => n.__data__.id === l.target.id))
                        .style('opacity', 1);
                }
            });
        }

        // Reset graph view
        function resetGraph() {
            node.style('opacity', 1);
            link.style('opacity', 0.6);
            labels.style('opacity', 1);
            document.getElementById('graph-info').style.display = 'none';

            // Reset zoom
            svg.transition().duration(750).call(
                d3.zoom().transform,
                d3.zoomIdentity
            );
        }

        // Handle empty graph
        if (graphData.nodes.length === 0) {
            container.append('text')
                .attr('x', width / 2)
                .attr('y', height / 2)
                .attr('text-anchor', 'middle')
                .attr('font-size', '18px')
                .attr('fill', '#666')
                .text('No documents or notes to display in graph');

            container.append('text')
                .attr('x', width / 2)
                .attr('y', height / 2 + 30)
                .attr('text-anchor', 'middle')
                .attr('font-size', '14px')
                .attr('fill', '#999')
                .text('Upload documents or create notes to see relationships');
        }
    </script>
</body>
</html>
