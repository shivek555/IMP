<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${note.title} + ' - Athenaum'">Note - Athenaum</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}"><i class="bi bi-book"></i> Athenaum</a>
            <div class="d-flex">
                <a class="btn btn-outline-light btn-sm me-2" th:href="@{/dashboard}"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-4">
        <div class="row">
            <!-- Note details -->
            <div class="col-md-8">
                <div class="card mb-3 shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 th:text="${note.title}">Note Title</h2>
                        <div>
                            <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="btn btn-sm btn-warning me-2">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <section th:if="${note.summary}" class="mb-3">
                            <h5><i class="bi bi-journal-text"></i> Summary</h5>
                            <p th:text="${note.summary}"></p>
                        </section>
                        <section th:if="${note.keywords}" class="mb-3">
                            <h5><i class="bi bi-tags"></i> Keywords</h5>
                            <div>
                                <span th:each="keyword : ${#strings.arraySplit(note.keywords, ',')}" 
                                      class="badge bg-success me-1 mb-1" th:text="${keyword.trim()}"></span>
                            </div>
                        </section>
                        <section>
                            <h5><i class="bi bi-file-text"></i> Content</h5>
                            <div th:text="${note.content}" class="p-3 border rounded" style="white-space: pre-wrap; line-height:1.5;"></div>
                        </section>
                    </div>
                    <div class="card-footer text-muted">
                        Created: <span th:text="${#temporals.format(note.createdAt, 'MMM dd, yyyy HH:mm')}"></span> |
                        Updated: <span th:text="${#temporals.format(note.updatedAt, 'MMM dd, yyyy HH:mm')}"></span>
                        <span th:if="${note.folder}"> | Folder: <strong th:text="${note.folder}"></strong></span>
                    </div>
                </div>
            </div>

            <!-- Related items sidebar -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5><i class="bi bi-diagram-3"></i> Related Items</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(relatedItems)}" class="text-muted">
                            No related items found.
                        </div>
                        <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(relatedItems)}">
                            <li class="list-group-item" th:each="item : ${relatedItems}">
                                <a th:href="@{/{type}s/{id}(type=${item.type},id=${item.id})}" th:text="${item.title}"></a>
                                <small class="text-muted ms-2" th:text="${item.type}"></small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>    
        </div>
    </div>

    <!-- Delete confirmation modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this note? This action cannot be undone.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" style="display: inline-block;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-danger">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
