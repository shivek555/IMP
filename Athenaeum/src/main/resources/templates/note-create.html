<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Create Note - Athenaeum</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px;">
  <div class="card shadow p-4" style="max-width: 600px; width: 100%;">
    <h2 class="mb-4 text-center">Create a New Note</h2>

    <form th:action="@{/notes/create}" th:object="${noteRequest}" method="post" novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
        <input type="text" th:field="*{title}" id="title" class="form-control" placeholder="Enter note title" required/>
      </div>

      <div class="mb-3">
        <label for="content" class="form-label">Content <span class="text-danger">*</span></label>
        <textarea th:field="*{content}" id="content" class="form-control" rows="6" placeholder="Write note content here" required></textarea>
      </div>

      <div class="mb-3">
        <label for="folder" class="form-label">Folder</label>
        <input type="text" th:field="*{folder}" id="folder" class="form-control" placeholder="Folder name (optional)"/>
      </div>

      <div class="mb-3">
        <label for="tags" class="form-label">Tags</label>
        <input type="text" th:field="*{tags}" id="tags" class="form-control" placeholder="Comma separated tags (optional)"/>
      </div>

      <button type="submit" class="btn btn-primary w-100">Create Note</button>
    </form>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Convert tags input to array format
        document.querySelector('form').addEventListener('submit', function(e) {
            const tagsInput = document.getElementById('tags');
            if (tagsInput.value) {
                const tags = tagsInput.value.split(',').map(tag => tag.trim()).filter(tag => tag);
                // Create hidden inputs for each tag
                tags.forEach(tag => {
                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'tags';
                    hiddenInput.value = tag;
                    this.appendChild(hiddenInput);
                });
                tagsInput.name = ''; // Disable original input
            }
        });
    </script>
</body>
</html>
