<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Athenaeum</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> Athenaeum</a>

            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Welcome, <span th:text="${user.firstName}"></span>!
                </span>
                <a class="btn btn-outline-light btn-sm" th:href="@{/auth/logout}">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${totalDocuments}">0</h4>
                                <p>Documents</p>
                            </div>
                            <i class="bi bi-file-earmark-text fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${totalNotes}">0</h4>
                                <p>Notes</p>
                            </div>
                            <i class="bi bi-journal-text fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 th:text="${#lists.size(documentFolders) + #lists.size(noteFolders)}">0</h4>
                                <p>Folders</p>
                            </div>
                            <i class="bi bi-folder fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4>Graph</h4>
                                <p>Knowledge</p>
                            </div>
                            <i class="bi bi-diagram-3 fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <a th:href="@{/documents/upload}" class="btn btn-primary">
                        <i class="bi bi-cloud-upload"></i> Upload Document
                    </a>
                    <a th:href="@{/notes/create}" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Create Note
                    </a>
                    <a th:href="@{/search}" class="btn btn-info">
                        <i class="bi bi-search"></i> Search
                    </a>
                    <a th:href="@{/dashboard/graph}" class="btn btn-warning">
                        <i class="bi bi-diagram-3"></i> Knowledge Graph
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Recent Documents -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-file-earmark-text"></i> Recent Documents</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(documents)}" class="text-muted">
                            No documents uploaded yet. <a th:href="@{/documents/upload}">Upload your first document</a>
                        </div>

                        <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(documents)}">
                            <div class="list-group-item" th:each="doc : ${documents}" th:if="${docStat.index < 5}">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">
                                        <a th:href="@{/documents/{id}(id=${doc.id})}" th:text="${doc.title}"></a>
                                    </h6>
                                    <small th:text="${#temporals.format(doc.createdAt, 'MMM dd, yyyy')}"></small>
                                </div>
                                <p class="mb-1 text-muted" th:text="${doc.summary}" th:if="${doc.summary}"></p>
                                <small class="text-muted">
                                    <span class="badge bg-secondary" th:text="${doc.fileType}"></span>
                                    <span th:if="${doc.folder}" class="badge bg-primary" th:text="${doc.folder}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Notes -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-journal-text"></i> Recent Notes</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(notes)}" class="text-muted">
                            No notes created yet. <a th:href="@{/notes/create}">Create your first note</a>
                        </div>

                        <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(notes)}">
                            <div class="list-group-item" th:each="note : ${notes}" th:if="${noteStat.index < 5}">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">
                                        <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.title}"></a>
                                    </h6>
                                    <small th:text="${#temporals.format(note.createdAt, 'MMM dd, yyyy')}"></small>
                                </div>
                                <p class="mb-1 text-muted" th:text="${note.summary}" th:if="${note.summary}"></p>
                                <small class="text-muted">
                                    <span th:if="${note.folder}" class="badge bg-primary" th:text="${note.folder}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/static/js/app.js}"></script>
</body>
</html>
